<!doctype html><html lang="de"><head><title>Magazin</title></head><body><nav>Rubriken Abo</nav><article><h1>Der Papierdrache</h1><p>Emil faltete einen roten Drachen aus Papier und nahm ihn mit auf den Hügel.</p><p>Der Wind hob den Drachen in die Luft, und seine Schwester lief lachend nebenher.</p><p>Am Abend bewahrten beide den Drachen für den nächsten Frühling auf.</p></article><aside>Ähnliche Beiträge</aside></body></html>
